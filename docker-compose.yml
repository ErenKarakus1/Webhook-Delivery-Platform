services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 migrate
    depends_on:
      - postgres
    volumes:
      - ./backend/database/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/webhook_platform
      FLYWAY_USER: webhook
      FLYWAY_PASSWORD: webhook

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  api-gateway:
    build:
      context: ./backend/services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"

  event-ingestion-service:
    build:
      context: ./backend/services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: event-ingestion-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8084:8084"

  webhook-management-service:
    build:
      context: ./backend/services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: webhook-management-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8083:8083"

  delivery-service:
    build:
      context: ./backend/services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: delivery-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka
    ports:
      - "8081:8081"

  scheduler-service:
    build:
      context: ./backend/services
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: scheduler-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"

volumes:
  postgres_data:
