services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 migrate
    depends_on:
      - postgres
    volumes:
      - ./backend/database/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/webhook_platform
      FLYWAY_USER: webhook
      FLYWAY_PASSWORD: webhook

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  webhook-management-service:
    build:
      context: ./backend/services
      dockerfile: webhook-management-service/Dockerfile
    depends_on:
      - flyway
      - postgres
      - kafka
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8083:8083"

  event-ingestion-service:
    build:
      context: ./backend/services
      dockerfile: event-ingestion-service/Dockerfile
    depends_on:
      - flyway
      - postgres
      - kafka
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8084:8084"

  delivery-service:
    build:
      context: ./backend/services
      dockerfile: delivery-service/Dockerfile
    depends_on:
      - flyway
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  scheduler-service:
    build:
      context: ./backend/services
      dockerfile: scheduler-service/Dockerfile
    depends_on:
      - flyway
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./backend/services
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - flyway
      - postgres
      - redis
      - webhook-management-service
      - event-ingestion-service
      - delivery-service
      - scheduler-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      SPRING_DATA_REDIS_HOST: redis
      SERVICES_WEBHOOK_MANAGEMENT_BASE_URL: http://webhook-management-service:8083
      SERVICES_EVENT_INGESTION_BASE_URL: http://event-ingestion-service:8084
      SERVICES_DELIVERY_BASE_URL: http://delivery-service:8081
      SERVICES_SCHEDULER_BASE_URL: http://scheduler-service:8082
      GATEWAY_CORS_ALLOWED_ORIGINS_0: http://localhost:5173
      GATEWAY_CORS_ALLOWED_ORIGINS_1: http://localhost:3000
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./frontend/dashboard
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  postgres_data:
