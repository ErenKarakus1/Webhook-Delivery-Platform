services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhook_platform}
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook} -d ${POSTGRES_DB:-webhook_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/database/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      FLYWAY_USER: ${POSTGRES_USER:-webhook}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-webhook}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  webhook-management-service:
    build:
      context: ./backend/services
      dockerfile: webhook-management-service/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "${WEBHOOK_MANAGEMENT_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  event-ingestion-service:
    build:
      context: ./backend/services
      dockerfile: event-ingestion-service/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "${EVENT_INGESTION_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  delivery-service:
    build:
      context: ./backend/services
      dockerfile: delivery-service/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${DELIVERY_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler-service:
    build:
      context: ./backend/services
      dockerfile: scheduler-service/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${SCHEDULER_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: ./backend/services
      dockerfile: api-gateway/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      webhook-management-service:
        condition: service_healthy
      event-ingestion-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      SERVICES_WEBHOOK_MANAGEMENT_BASE_URL: http://webhook-management-service:8083
      SERVICES_EVENT_INGESTION_BASE_URL: http://event-ingestion-service:8084
      SERVICES_DELIVERY_BASE_URL: http://delivery-service:8081
      SERVICES_SCHEDULER_BASE_URL: http://scheduler-service:8082
      GATEWAY_CORS_ALLOWED_ORIGINS_0: http://localhost:5173
      GATEWAY_CORS_ALLOWED_ORIGINS_1: http://localhost:3000
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      context: ./frontend/dashboard
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:80"

volumes:
  postgres_data:
